# Secrets only — non-secret config lives in deploy/k8s/configmap.example.yaml.
# Copy to secret.yaml, fill in real values, then:
#   kubectl apply -f deploy/k8s/secret.yaml
# Do NOT commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: sidegit-secret
type: Opaque
stringData:
  # DATABASE_URL: "postgresql://user:pass@postgres:5432/sidegit"
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_REGION: "us-east-1"
  # SIDEGIT_S3_BUCKET: "sidegit-blobs"
  # SIDEGIT_S3_ENDPOINT_URL: ""   # empty/unset = AWS; set for MinIO/R2
